[project]
name = "magazineads"
version = "0.1.0"
description = "Computational pipeline for extracting and analyzing advertisements from 20th-century American magazines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Core
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "h5py>=3.10",
    "tqdm>=4.65",

    # Deep learning
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.35",
    "ultralytics>=8.1",

    # Image processing
    "Pillow>=10.0",
    "opencv-python-headless>=4.8",

    # OCR
    "surya-ocr>=0.4",

    # Face detection
    "insightface>=0.7",
    "onnxruntime>=1.16",

    # Statistical inference
    "ppi-python",

    # Plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",

    # NLP (sentence splitting for OCR text)
    "spacy>=3.7",

    # CLIP (OpenAI variant, optional but preferred)
    "ftfy>=6.1",
    "regex>=2023.0",

    # Scraping
    "internetarchive>=4.0",
    "wget>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["magazineads*"]
